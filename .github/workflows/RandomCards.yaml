name: RandomCards Daily

on:
  schedule:
    - cron: "0 12 * * *"

  workflow_dispatch:

concurrency:
  group: randomcards-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Publish daily card
        env:
          TWITTERAPIS_KEY: ${{ secrets.TWITTERAPIS_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          POST_TEXT: ""
        run: |
          python main.py

      - name: Save history
        run: |
          git config user.name "RandomCards Bot"
          git config user.email "randomcards-bot@users.noreply.github.com"

          git add data/card_stats.csv

          if git diff --cached --quiet; then
            echo "No history changes."
          else
            git commit -m "chore: record daily card"
            git push
          fi